# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
#
name: Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  linux-rpm:
    name: Build Linux rpm (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: clang
      CXX: clang++
      GRAM_RPM_COMPRESSION: zstd
    steps:
      # This workspace's release target dir runs well past what fits in the
      # runner's default free disk space, so free up the preinstalled
      # toolchains we don't use before doing anything else.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          docker image prune --all --force || true
          df -h /

      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.3
        with:
          shared-key: linux-release

      - name: Install dependencies
        run: ./script/prepare-ci release

      - name: Check disk space
        run: df -h /

      - name: Bundle Linux rpm
        run: ./script/bundle-linux --rpm --no-build-remote

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          rpm_path="$(find target -name '*.rpm' -print -quit)"
          if [[ -z "${rpm_path}" ]]; then
            echo "Error: no .rpm produced" >&2
            exit 1
          fi
          cp "${rpm_path}" "artifacts/visual-md-gram-${version}-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64-rpm
          path: artifacts/*
          if-no-files-found: error

  windows-installer:
    name: Build Windows installer (x86_64)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.3
        with:
          shared-key: windows-release

      - name: Bundle Windows
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          cp "target/Gram-x86_64.exe" "artifacts/visual-md-gram-${version}-x86_64-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64-installer
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux-rpm, windows-installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
