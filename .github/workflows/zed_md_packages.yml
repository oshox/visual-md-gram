# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
#
# Builds the Zed MD Windows installer, Linux tarball and Linux remote server. Runs manually, or on
# a `v*` tag, where it also publishes a GitHub release.
name: Zed MD Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Build Linux tarball (x86_64)
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CC: clang
      CXX: clang++
    steps:
      # The release target dir runs well past the runner's default free disk
      # space, so free up preinstalled toolchains we don't use first.
      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          docker image prune --all --force || true
          df -h /

      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The app looks up its own version's release by tag when it downloads
      # the remote server, so a tag that disagrees with the crate version
      # would publish a release the app can never find.
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Error: tag ${GITHUB_REF_NAME} does not match crates/zed version v${app_version}" >&2
            exit 1
          fi

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.3
        with:
          shared-key: zed-md-linux-release

      - name: Install dependencies
        run: ./script/linux

      - name: Bundle Linux
        run: ./script/bundle-linux

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          tarball="$(find target -name 'zed-linux-*.tar.gz' -print -quit)"
          if [[ -z "${tarball}" ]]; then
            echo "Error: no Linux tarball produced" >&2
            exit 1
          fi
          cp "${tarball}" "artifacts/zed-md-${version}-linux-x86_64.tar.gz"

          # Served to WSL and SSH hosts by the app (see
          # `release_asset_matches` in crates/auto_update).
          remote_server="$(find target -name 'zed-remote-server-linux-x86_64.gz' -print -quit)"
          if [[ -z "${remote_server}" ]]; then
            echo "Error: no Linux remote server produced" >&2
            exit 1
          fi
          cp "${remote_server}" "artifacts/zed-remote-server-linux-x86_64.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: artifacts/*
          if-no-files-found: error

  windows:
    name: Build Windows installer (x86_64)
    if: github.repository_owner != 'zed-industries'
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Rust build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.3
        with:
          shared-key: zed-md-windows-release

      - name: Bundle Windows
        shell: pwsh
        run: script/bundle-windows.ps1 -Architecture x86_64

      - name: Collect artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p artifacts
          cp "target/ZedMD-x86_64.exe" "artifacts/zed-md-${version}-x86_64-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64-installer
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zed MD ${GITHUB_REF_NAME}" \
            --generate-notes
